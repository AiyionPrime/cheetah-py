[project]
name = "cheetah-py"
version = "4.0.0"
description = "Cheetah Software API"
readme = "README.md"
authors = [
    { name = "Burfeind, Jan-Niklas", email = "jan-niklas.burfeind@sennheiser.com" }
]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
format.exclude = ["*/vendor/*"]
lint.select = ["ALL"]
lint.ignore = [
    "D203",    # incompatible to D211
    "D212",    # incompatible to D213
    "CPY001",  # Sennheiser does not require copyright notices in every file
]

[tool.ruff.lint.per-file-ignores]
"**/vendor/v4_00/*/cheetah_py.py" = ["ALL"]
# republish of internal interface per PEP8 is defensible
"src/cheetah_py/__init__.py" = ["F403"]
"tests/*" = ["S101"]
